<!-- ══════════════════════════════════════════════════════════════
  로그 글 템플릿 — 새 글 추가 절차:
    1. 이 파일을 log/<slug>/index.html 로 복사
    2. ◇ 표시를 전부 교체한다 — ◇가 하나라도 남아 있으면 발행 금지
    3. 본문을 쓴다. 부품은 css/log.css 참조:
       .when(날짜 키커) · blockquote(+.src) · .term(세션 로그) · .disc(디스코드 재현)
       .tbl>table · figure(.banner/.ab/.gal/.vid-solo/.vid-grid) · .stats · .tldr
       (배너·스탯·요약 골격은 아래 주석 블록을 풀어 쓴다 — article 앞에 둔다)
    4. data/portfolio.json 의 "projects" 배열에 카드 추가 — 아래 조각을 붙여넣고 수정:
       { "id": "◇slug", "category": "content", "status": "EXPERIMENT",
         "title": { "en": "◇Title", "ko": "◇제목" },
         "desc": { "en": "◇one-liner (written up in Korean).", "ko": "◇한 줄." },
         "tags": ["◇태그"], "image": "log/◇slug/img/cover.jpg",
         "links": { "site": "log/◇slug/" }, "date": "◇YYYY-MM" }
       cover.jpg = 글 배너를 카드용으로 한 장 (없으면 image 줄 삭제 — 해칭 플레이스홀더로 뜸)
    5. 발행 전 검사 (둘 다 통과해야 푸시):
       grep -n '◇' log/<slug>/index.html          ← 빈 출력이어야 함
       python3 -m json.tool data/portfolio.json    ← 에러 없어야 함
  스타일·토큰·라디오 칩은 전부 공용(tokens/corner/log.css + radio.js 주입)이라 손댈 것 없음.
  ?v= 값은 전 페이지 공통 상수 — 공용 CSS/JS를 고친 날짜로 전 파일 일괄 교체.
═══════════════════════════════════════════════════════════════ -->
